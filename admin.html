<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Inventario</title>
    <!--Icono tab-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!--CSS (incluye bootstrap)-->
    <link href="assets/css/stylesconbootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <!-- Navbar responsivo-->
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container px-5">
            <a class="navbar-brand text-white" href="index.html">Tecno Chile</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active text-white" aria-current="page"
                            href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item"><a class="nav-link text-white" href="index.html#destacados">Productos
                            Destacados</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="catalogo.html">Tienda</a></li>
                    <li class="nav-item">
                        <p class="nav-link text-white" id="mensajeBienvenida"></p>
                    </li>
                    <li class="nav-item"><a class="nav-link text-white" href="admin.html">Administración</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Formulario emergente -->
    <div id="modalCliente" class="modal">
        <div class="modal-content">
            <h2>Bienvenido</h2>
            <p>Por favor, ingrese su nombre y apellido</p>
            <input type="text" id="inputNombre" placeholder="Nombre">
            <input type="text" id="inputApellido" placeholder="Apellido">
            <button id="btnGuardarCliente">Guardar</button>
        </div>
    </div>
    <!-- Sección cliente -->
    <div class="oculto">
        <span id="nombreCliente"></span>
    </div>
    <div class="oculto">
        <p id="mensajeBienvenida"></p>
    </div>
    <div class="container my-5">
        <h2>Administrador de Inventario</h2>
        <!-- Formulario para agregar producto -->
        <form id="formNuevo" class="mb-4">
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoNombre" placeholder="Nombre" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoMarca" placeholder="Marca" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoCodigo" placeholder="Código" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoImagen" placeholder="URL Imagen" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoDescripcion" placeholder="Descripción" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="number" class="form-control" id="nuevoPrecio" placeholder="Precio" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="text" class="form-control" id="nuevoCategoria" placeholder="Categoría" required>
                </div>
                <div class="col-md-6 col-lg-4">
                    <input type="number" class="form-control" id="nuevoCantidad" placeholder="Cantidad" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success px-4">Agregar</button>
                </div>
            </div>
        </form>
        <table class="table table-striped" id="tabla-inventario">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Marca</th>
                    <th>Código</th>
                    <th>Imagen</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- JS generará los productos aquí -->
            </tbody>
        </table>
    </div>
    <!-- Modal de edición -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarLabel">Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditar">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control" id="editMarca" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text" class="form-control" id="editCodigo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen (URL)</label>
                            <input type="text" class="form-control" id="editImagen" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="editDescripcion" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" class="form-control" id="editPrecio" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoría</label>
                            <input type="text" class="form-control" id="editCategoria" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="editCantidad" required>
                        </div>
                        <input type="hidden" id="editIndex">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/index.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
